# Start a release from main:  gh workflow run release.yml
# (or GitHub → Actions → Release → Run workflow). The version comes from tauri.conf.json, so
# bump it first (tauri.conf.json, package.json, src-tauri/Cargo.toml), commit and push to main.
# GitHub builds the Windows installer and the Mac universal .dmg, signs the update files and
# publishes them with latest.json to the public repo bearyber/nest-releases as v<version>.
# Installed copies update from there. The tag v<version> is then added to this repo too.
#
# Why from main and not from a tag: GitHub only shares the build cache within a branch. Every
# tag counted as new, so each release compiled from zero. Runs on main reuse the last cache.
#
# "Build only" (publish = false) builds and runs the gate without releasing anything: handy to
# test this file or warm the cache.
#
# Three things run at the same time, so a release takes as long as the slowest build:
#   create-release: a hidden draft release in nest-releases (fails in seconds if something's off)
#   gate:           fmt, clippy, all tests (Windows)
#   build:          Windows + Mac build and upload into the draft
# publish: only when the gate AND both builds succeeded does the draft go public (and only
#          with latest.json present), so installed apps never see a failing or half-finished release
#
# Windows speedup: linking uses rust-lld instead of Microsoft's slower link.exe. (A Dev Drive
# mounted on src-tauri/target was tried and removed: rust-cache couldn't read the mount, so
# Windows never got its cache.)
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release (off = build and test only)"
        type: boolean
        default: true

# Never two releases at once.
concurrency:
  group: release
  cancel-in-progress: false

# Least access by default; only the publish job may write (it tags this repo).
permissions:
  contents: read

env:
  RELEASES_REPO: bearyber/nest-releases

jobs:
  create-release:
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: version
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases only run from main (this run is on $GITHUB_REF_NAME)."
            exit 1
          fi
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$conf" != "$pkg" ] || [ "$conf" != "$cargo" ]; then
            echo "::error::Versions don't match: tauri.conf.json $conf, package.json $pkg, Cargo.toml $cargo"
            exit 1
          fi
          # The release notes: this version's lines from src/whats-new.json, one "- line" each.
          # They go into the release body and into latest.json (the update bar shows them).
          # The text only ever travels in files and env vars, never inside a script.
          mkdir -p "$RUNNER_TEMP"
          jq -r --arg v "$conf" '.[$v] // empty | .[] | "- " + .' src/whats-new.json > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::src/whats-new.json has no lines for $conf. Add a \"$conf\" entry, commit, push, run again."
            exit 1
          fi
          echo "Releasing v$conf"
          echo "tag=v$conf" >> "$GITHUB_OUTPUT"
      - id: draft
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Never overwrite a version that's already out.
          if gh api "repos/$RELEASES_REPO/releases/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG is already published in nest-releases. Bump the version and run again."
            exit 1
          fi
          # Drafts can't be looked up by tag, so keep the id straight from the create reply.
          # -F body=@file reads the text from the file (it is not interpreted as a script).
          id=$(gh api "repos/$RELEASES_REPO/releases" \
            -f tag_name="$TAG" -f target_commitish=main -f name="Nest $TAG" \
            -F body=@"$RUNNER_TEMP/notes.md" \
            -F draft=true --jq .id)
          if [ -z "$id" ]; then echo "::error::Couldn't create the draft release"; exit 1; fi
          echo "Draft release id: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  gate:
    runs-on: windows-latest
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"
          key: gate
      - run: npm ci
      - name: Gate (CLAUDE.md)
        shell: bash
        run: |
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml
          npm run typecheck && npm run lint && npm test

  build:
    needs: create-release
    # Also runs for "build only", where create-release is skipped.
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            # Signed with the Developer ID certificate and notarised by Apple (no "Open Anyway").
            args: "--target universal-apple-darwin --config src-tauri/tauri.signing.conf.json"
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # The same lines for latest.json "notes" (the update bar). Passed as a step output with a
      # random heredoc delimiter, and only used in `with:` below, never inside a script.
      - id: notes
        shell: bash
        run: |
          ver=$(jq -r .version src-tauri/tauri.conf.json)
          lines=$(jq -r --arg v "$ver" '.[$v] // empty | .[] | "- " + .' src/whats-new.json)
          if [ -z "$lines" ]; then
            echo "::error::src/whats-new.json has no lines for $ver."
            exit 1
          fi
          delim="NOTES_$(openssl rand -hex 8)"
          {
            echo "body<<$delim"
            echo "$lines"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      # Mac signing + notarisation: the Developer ID certificate (.p12, base64) and an App Store
      # Connect API key (.p8). Refuse to build a Mac app without them rather than ship it unsigned.
      # The secrets only travel in env vars and a temp file, never inside a script.
      - if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=""
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8 KEYCHAIN_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Mac signing secrets missing:$missing. Add them in GitHub → nest → Settings → Secrets → Actions."
            exit 1
          fi
          # IDs pasted from a web page can carry a stray space or line break: trim, then check.
          issuer=$(printf '%s' "$APPLE_API_ISSUER" | tr -d '[:space:]')
          keyid=$(printf '%s' "$APPLE_API_KEY" | tr -d '[:space:]')
          if ! printf '%s' "$issuer" | grep -Eq '^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$'; then
            echo "::error::APPLE_API_ISSUER isn't an Issuer ID (it should look like 57246542-96fe-1a63-e053-0824d011072a). Copy it again from App Store Connect → Users and Access → Integrations → App Store Connect API."
            exit 1
          fi
          if ! printf '%s' "$keyid" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "::error::APPLE_API_KEY isn't a Key ID (10 letters and numbers, e.g. F4UWS3F2A7)."
            exit 1
          fi
          echo "APPLE_API_ISSUER=$issuer" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$keyid" >> "$GITHUB_ENV"
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Used by the Mac build only (empty on Windows).
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: "${{ matrix.platform == 'macos-latest' && 'Developer ID Application: Bernard Law (Y248YY8R3G)' || '' }}"
          # APPLE_API_KEY, APPLE_API_ISSUER, APPLE_API_KEY_PATH: set (trimmed) by the check step above.
          KEYCHAIN_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.KEYCHAIN_PASSWORD || '' }}
        with:
          owner: bearyber
          repo: nest-releases
          # Empty for "build only": tauri-action then builds without uploading anything.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseBody: ${{ steps.notes.outputs.body }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # "Build only" runs upload nowhere: keep the installers as a downloadable artifact so a
      # build can be tried before it's released (e.g. a signed Mac app opening with no warning).
      - if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nest-${{ matrix.platform }}
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/nsis/*-setup.exe
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: [create-release, gate, build]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          # Refuse to publish a release without the update manifest (it would break updates).
          names=$(gh api "repos/$RELEASES_REPO/releases/$ID/assets" --jq '.[].name')
          echo "$names"
          echo "$names" | grep -qx "latest.json" || { echo "::error::latest.json missing, not publishing"; exit 1; }
          gh api -X PATCH "repos/$RELEASES_REPO/releases/$ID" -F draft=false -f make_latest=true --jq '.html_url'
      - name: Tag this repo with the released version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null \
            || echo "::warning::Couldn't add tag $TAG here (already exists?). The release itself is out."
