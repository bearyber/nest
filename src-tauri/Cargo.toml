[package]
name = "nest"
version = "0.7.1"
description = "Nest by INTRVL"
authors = ["INTRVL"]
edition = "2021"

[lib]
# `_lib` suffix avoids a lib/bin name clash on Windows (cargo#8519).
name = "nest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-log = "2"
log = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
trash = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fs4 = { version = "1", default-features = false }
# The "Nest couldn't start" message box, shown before Tauri (and its dialog plugin) is ready.
# Already in the build via tauri-plugin-dialog: same version, same features.
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }

# Windows: open at login through the Run entry. (macOS uses SMAppService below.)
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-autostart = "2"

# macOS: open at login as a real Login Item (SMAppService.mainApp, macOS 13+), and asking
# AppKit whether this launch was a login launch. Both already in the build (via autostart).
# libc (already in the build): is a volume read-only (statfs), rename without replacing
# (renamex_np RENAME_EXCL) for the move to Applications.
[target.'cfg(target_os = "macos")'.dependencies]
smappservice-rs = "0.1.3"
objc2 = "0.6"
libc = "0.2"
# The accent colour from AppKit (NSColor.controlAccentColor). Already in the build (via Tauri).
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSColor", "NSColorSpace"] }

# Windows: the accent colour from Settings (UISettings). Already in the build (via Tauri's webview).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["UI_ViewManagement"] }

[dev-dependencies]
tempfile = "3"

# Thin LTO + default codegen units: much faster release builds (CI and local), with a
# near-identical app. Nest is disk/UI bound, so the last few % of CPU speed don't matter.
[profile.release]
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
