<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Nest, option 2: bowl and egg</title>
  <defs>
    <linearGradient id="o2-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f3ef"/>
      <stop offset="1" stop-color="#e5e1d9"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#o2-bg)"/>
  <!-- two concentric arcs form the bowl -->
  <path d="M212 382 A300 300 0 0 0 812 382" fill="none" stroke="#222327" stroke-width="80" stroke-linecap="round"/>
  <path d="M322 382 A190 190 0 0 0 702 382" fill="none" stroke="#222327" stroke-width="80" stroke-linecap="round"/>
  <!-- the egg -->
  <ellipse cx="512" cy="392" rx="76" ry="90" fill="#2b5cff"/>
</svg>
