<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Nest, option 1: nested folders</title>
  <defs>
    <linearGradient id="o1-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2e33"/>
      <stop offset="1" stop-color="#17181b"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#o1-bg)"/>
  <!-- outer folder -->
  <rect x="212" y="262" width="240" height="120" rx="40" fill="#ebe7df"/>
  <rect x="212" y="322" width="600" height="440" rx="56" fill="#ebe7df"/>
  <!-- middle folder (the hollow) -->
  <rect x="292" y="382" width="170" height="90" rx="30" fill="#2b2d31"/>
  <rect x="292" y="426" width="440" height="276" rx="40" fill="#2b2d31"/>
  <!-- inner folder (accent) -->
  <rect x="372" y="476" width="110" height="60" rx="20" fill="#f5a524"/>
  <rect x="372" y="506" width="280" height="136" rx="28" fill="#f5a524"/>
</svg>
